name: Build next level batch

# The level supply (tools/levels-next.ts). Started by api/progress.js when the game reports the
# player's progress, or by hand from the Actions tab. Builds at most one batch per run, never more
# than 20 levels past the player, commits it to main, and Vercel deploys it. Runs queue one at a
# time; a newer request replaces one still waiting.
on:
  workflow_dispatch:
    inputs:
      cleared:
        description: "Levels the player has cleared (play order)"
        required: true
      played:
        description: "Recent cleared levels as JSON: [{index, stars, attempts}]"
        required: false
        default: "[]"
      dry_run:
        description: "Plan only, build nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: levels-next
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          # A queued run must see the batches landed while it waited, not main as of its dispatch.
          ref: main
          fetch-depth: 100
      # The endpoint cannot tell a real player from a made-up report, so cap the supply's growth.
      # One batch an hour however many players report: the run queued behind a build that just
      # landed stops here, so a burst of reports becomes one batch.
      - name: Caps (1 batch an hour, 6 a day)
        id: cap
        run: |
          day=$(git log --since='24 hours ago' --author='level-supply' --oneline | wc -l)
          hour=$(git log --since='1 hour ago' --author='level-supply' --oneline | wc -l)
          echo "batches in the last 24 h: $day, last hour: $hour"
          if [ "$day" -lt 6 ] && [ "$hour" -lt 1 ]; then echo "go=true"; else echo "go=false"; fi >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        if: ${{ steps.cap.outputs.go == 'true' }}
      - uses: actions/setup-node@v4
        if: ${{ steps.cap.outputs.go == 'true' }}
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: ${{ steps.cap.outputs.go == 'true' }}
      - name: Plan and build the batch
        if: ${{ steps.cap.outputs.go == 'true' }}
        env:
          CLEARED: ${{ inputs.cleared }}
          PLAYED: ${{ inputs.played }}
        run: pnpm levels:next --cleared "$CLEARED" --played "$PLAYED" ${{ inputs.dry_run && '--dry-run' || '' }}
      # tools/eval-pack.test.ts (part of `pnpm check`) wants a levels/eval side file for every level of every
      # pack in the index, so a batch pushed without them turns main red. Any pack still missing them is rated here.
      - name: Rate the new levels
        if: ${{ !inputs.dry_run && steps.cap.outputs.go == 'true' }}
        run: |
          for pack in $(node -p "require('./levels/packs/index.json').packs.join(' ')"); do
            [ -f "levels/eval/$pack/index.json" ] || pnpm levels:eval "$pack"
          done
      - name: Commit the new pack
        if: ${{ !inputs.dry_run && steps.cap.outputs.go == 'true' }}
        run: |
          if [ -z "$(git status --porcelain levels/packs levels/eval)" ]; then echo "no new levels"; exit 0; fi
          git config user.name "level-supply[bot]"
          git config user.email "level-supply@users.noreply.github.com"
          git add levels/packs levels/candidates levels/eval
          git commit -m "Levels: next batch for a player at level ${{ inputs.cleared }}"
          git pull --rebase origin main
          git push origin HEAD:main

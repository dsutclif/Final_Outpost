<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>3D renderer lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #1d1714; color: #f4ece4; font: 600 13px/1.3 system-ui, sans-serif; }
    #bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; background: #2a201b; position: sticky; top: 0; z-index: 5; }
    #bar label { display: inline-flex; gap: 4px; align-items: center; }
    #bar select, #bar button, #bar input { font: inherit; background: #3a2c25; color: inherit; border: 1px solid #5a463c; border-radius: 6px; padding: 3px 8px; }
    #bar button.on { background: #ff7a3d; color: #1d1714; }
    #stats { margin-left: auto; font-variant-numeric: tabular-nums; }
    #main { display: flex; gap: 16px; padding: 12px; align-items: flex-start; justify-content: center; }
    #stage { position: relative; width: 390px; height: 780px; border-radius: 28px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.5); flex: none; }
    #lab { position: relative; width: min(1100px, calc(100vw - 32px)); height: calc(100vh - 80px); border-radius: 12px; overflow: hidden; display: none; }
    #lab canvas { width: 100%; height: 100%; display: block; }
    #info { max-height: 780px; overflow: auto; font: 12px/1.35 ui-monospace, monospace; white-space: pre; background: #2a201b; padding: 10px; border-radius: 10px; min-width: 300px; }
    .full #bar, .full #info { display: none; } .full #main { padding: 0; } .full #stage { width: 100vw; height: 100vh; border-radius: 0; box-shadow: none; }
    .mode-lab #stage { display: none; } .mode-lab #lab { display: block; }
  </style>
</head>
<body>
  <div id="bar">
    <label>Level <select id="level"></select></label>
    <label>Skin <select id="skin"></select></label>
    <label>Quality <select id="quality"><option>low</option><option selected>medium</option><option>high</option></select></label>
    <button id="mGame" class="on">Game</button><button id="mLab">Asset lab</button>
    <label><input type="checkbox" id="anchors" /> anchors</label>
    <label>FF ticks <input id="ff" type="number" value="0" style="width:70px" /></label>
    <button id="restart">Restart</button>
    <span id="stats"></span>
  </div>
  <div id="main"><div id="stage"></div><div id="lab"></div><div id="info"></div></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>

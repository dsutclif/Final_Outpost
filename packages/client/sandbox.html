<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1c1d20" />
    <title>Asset table</title>
    <style>
      :root { --bg: #1c1d20; --panel: rgba(24, 25, 28, 0.96); --fg: #eceae4; --dim: #9a978f; --acc: #e0a25a; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 15px/1.3 system-ui, -apple-system, sans-serif; overflow: hidden; touch-action: none; }
      #stage { position: fixed; left: 0; right: 0; top: 0; bottom: var(--panel-h, 120px); overflow: hidden; touch-action: none; }
      #panel { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
        border-top: 1px solid #333; }
      button { font: inherit; color: var(--fg); background: #2c2d31; border: 1px solid #444; border-radius: 8px; padding: 7px 12px; }
      .row { display: grid; grid-template-columns: auto 1fr 3em; gap: 10px; align-items: center; }
      .row label { color: var(--dim); font-size: 14px; }
      .row output { text-align: right; font-variant-numeric: tabular-nums; }
      input[type=range] { width: 100%; min-width: 0; accent-color: var(--acc); }
      .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 9px; }
      #stats { position: fixed; inset: 0 0 var(--panel-h, 120px) 0; background: rgba(18, 19, 21, 0.97); overflow-y: auto; touch-action: pan-y; padding: 12px 16px; display: none; }
      #stats.open { display: block; }
      #stats select { font: inherit; color: var(--fg); background: #2c2d31; border: 1px solid #444; border-radius: 8px; padding: 6px; max-width: 100%; }
      #stats h3 { margin: 16px 0 4px; color: var(--acc); font-size: 15px; }
      #stats .note { color: var(--dim); font-size: 12px; margin: 0 0 4px; }
      #stats table { width: 100%; border-collapse: collapse; font-size: 13px; }
      #stats td { padding: 3px 6px 3px 0; border-top: 1px solid #2a2b2f; vertical-align: top; }
      #stats td.v { font-variant-numeric: tabular-nums; white-space: nowrap; }
      #stats td.s { color: var(--dim); font-size: 11px; word-break: break-word; }
      #stats tr.code td.s { color: #e8745a; }
      #stats tr.code td.s::before { content: "CODE "; font-weight: 700; }
      #status { margin-top: 8px; color: var(--dim); font-size: 13px; min-height: 1.3em; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="stats"></div>
    <div id="panel">
      <div class="row">
        <label for="bright">Model brightness</label>
        <input id="bright" type="range" min="0.5" max="3" step="0.05" />
        <output id="brightOut"></output>
      </div>
      <div class="btns">
        <button id="center">Centre</button>
        <button id="reset">Reset</button>
        <button id="copy">Copy link</button>
        <button id="statsBtn">Fighter stats</button>
        <button id="arenaBtn">Fighter arena</button>
        <button id="crashBtn">Crash site</button>
        <button id="layoutBtn">Layout</button>
        <button id="bldgBtn">Buildings row</button>
        <a href="layout.html" style="color: var(--dim); font-size: 14px; align-self: center">Layout sandbox</a>
      </div>
      <div id="status"></div>
    </div>
    <script>
      // the stage fills the screen above the panel, whatever height the panel takes
      const p = document.getElementById("panel");
      const fit = () => document.documentElement.style.setProperty("--panel-h", p.offsetHeight + "px");
      fit(); new ResizeObserver(fit).observe(p);
    </script>
    <script type="module" src="/src/dev/sandbox.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1c1d20" />
    <title>Layout sandbox</title>
    <style>
      :root { --bg: #1c1d20; --panel: rgba(24, 25, 28, 0.92); --fg: #eceae4; --dim: #9a978f; --acc: #e0a25a; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 15px/1.3 system-ui, -apple-system, sans-serif; overflow: hidden; touch-action: none; }
      #stage { position: fixed; inset: 0; }
      #panel { position: fixed; left: 0; right: 0; bottom: 0; max-height: 46vh; overflow-y: auto; background: var(--panel);
        padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid #333; touch-action: pan-y; }
      #panel.hidden .body { display: none; }
      .top { display: flex; gap: 8px; align-items: center; }
      .top select { flex: 1; min-width: 0; }
      button, select { font: inherit; color: var(--fg); background: #2c2d31; border: 1px solid #444; border-radius: 8px; padding: 7px 10px; }
      button.on { border-color: var(--acc); color: var(--acc); }
      .row { display: grid; grid-template-columns: 7.5em 1fr 3.2em; gap: 8px; align-items: center; margin-top: 9px; }
      .row label { color: var(--dim); font-size: 14px; }
      .row output { text-align: right; font-variant-numeric: tabular-nums; }
      input[type=range] { width: 100%; accent-color: var(--acc); }
      #status { margin-top: 8px; color: var(--dim); font-size: 13px; min-height: 1.3em; }
      #status.err { color: #ff8a7a; }
      #vibe { position: fixed; top: calc(10px + env(safe-area-inset-top)); right: 10px; width: 30vw; max-width: 220px; border: 1px solid #555;
        border-radius: 6px; display: none; }
      #vibe.big { width: 92vw; max-width: 700px; }
      #vibe.show { display: block; }
      #hint { position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 10px; font-size: 13px; color: var(--dim);
        background: var(--panel); padding: 4px 8px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="hint">Drag to pan</div>
    <img id="vibe" src="dev/vibe.jpg" alt="Vibe reference" />
    <div id="panel">
      <div class="top">
        <select id="level"></select>
        <button id="vibeBtn">Vibe</button>
        <button id="toggle">Hide</button>
      </div>
      <div class="body">
        <div id="sliders"></div>
        <div class="top" style="margin-top: 10px">
          <button id="reset">Reset</button>
          <button id="center">Centre</button>
          <button id="copy">Copy link</button>
        </div>
        <div id="status"></div>
      </div>
    </div>
    <script type="module" src="/src/dev/sandbox.ts"></script>
  </body>
</html>

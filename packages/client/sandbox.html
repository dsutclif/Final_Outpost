<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1c1d20" />
    <title>Asset table</title>
    <style>
      :root { --bg: #1c1d20; --panel: rgba(24, 25, 28, 0.96); --fg: #eceae4; --dim: #9a978f; --acc: #e0a25a; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 15px/1.3 system-ui, -apple-system, sans-serif; overflow: hidden; touch-action: none; }
      #stage { position: fixed; left: 0; right: 0; top: 0; bottom: var(--panel-h, 120px); overflow: hidden; touch-action: none; }
      #labels { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
      .lbl { position: absolute; left: 0; top: 0; white-space: nowrap; font-size: 12px; font-weight: 600; color: #fff; background: rgba(0, 0, 0, 0.6);
        padding: 1px 5px; border-radius: 4px; }
      #panel { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
        border-top: 1px solid #333; }
      button { font: inherit; color: var(--fg); background: #2c2d31; border: 1px solid #444; border-radius: 8px; padding: 7px 12px; }
      .row { display: grid; grid-template-columns: auto 1fr 3em; gap: 10px; align-items: center; }
      .row label { color: var(--dim); font-size: 14px; }
      .row output { text-align: right; font-variant-numeric: tabular-nums; }
      input[type=range] { width: 100%; min-width: 0; accent-color: var(--acc); }
      .btns { display: flex; gap: 8px; margin-top: 9px; }
      #status { margin-top: 8px; color: var(--dim); font-size: 13px; min-height: 1.3em; }
    </style>
  </head>
  <body>
    <div id="stage"><div id="labels"></div></div>
    <div id="panel">
      <div class="row">
        <label for="bright">Model brightness</label>
        <input id="bright" type="range" min="0.5" max="3" step="0.05" />
        <output id="brightOut"></output>
      </div>
      <div class="btns">
        <button id="center">Centre</button>
        <button id="reset">Reset</button>
        <button id="copy">Copy link</button>
      </div>
      <div id="status"></div>
    </div>
    <script>
      // the stage fills the screen above the panel, whatever height the panel takes
      const p = document.getElementById("panel");
      const fit = () => document.documentElement.style.setProperty("--panel-h", p.offsetHeight + "px");
      fit(); new ResizeObserver(fit).observe(p);
    </script>
    <script type="module" src="/src/dev/sandbox.ts"></script>
  </body>
</html>

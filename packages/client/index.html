<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#8a4d2e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Outpost" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Farthest Outpost</title>
    <!-- the title poster inline (build fills the data URI), so the scene paints with the first bytes of the document, before any file loads; app.ts removes it once the title video plays -->
    <style>#boot-poster{position:fixed;inset:0;z-index:0;background:#0c0d0f url(%TITLE_POSTER_DATA%) center/cover no-repeat;transition:opacity .5s ease;pointer-events:none}#boot-poster.off{opacity:0}</style>
  </head>
  <body>
    <div id="boot-poster" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
